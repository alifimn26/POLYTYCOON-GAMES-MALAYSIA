        // =====================================================================
        // MULTIPLAYER NETWORKING — serverless, works from GitHub Pages (HTTPS)
        //   1. MQTT over WSS on two public brokers in parallel (primary relay, firewall-proof)
        //   2. PeerJS WebRTC direct link to the host (lower latency, best effort)
        //   3. BroadcastChannel for multi-tab testing in one browser
        // Every packet carries a msgId, so duplicates arriving over several transports
        // are dropped. Every room state carries a (version, updatedAt, author) stamp,
        // so stale or out-of-order states never overwrite newer ones.
        // =====================================================================
        const NET_PROTOCOL_VERSION = 'v4';
        const MQTT_BROKER_URLS = [
            'wss://broker.emqx.io:8084/mqtt',
            'wss://broker.hivemq.com:8884/mqtt'
        ];
        const NET_MAX_PACKET_BYTES = 256 * 1024;
        const NET_HEARTBEAT_MS = 5000;
        const NET_HOST_TIMEOUT_MS = 16000;
        const NET_JOIN_RETRY_MS = 2500;
        const NET_PEER_CONNECT_WINDOW_MS = 12000;
        const NET_STATE_COALESCE_MS = 40;
        const NET_MAX_SEATS = 6;

        let peerInstance = null;
        let peerConnections = [];
        let peerHeartbeatInterval = null;
        let joinRetryInterval = null;
        let mqttClient = null; // first broker client (kept for backwards compatibility)
        let mqttClients = [];
        let mqttConnected = false;
        let activeMqttTopic = null;
        let localBroadcastChannel = null;
        const myClientUniqueId = "client_" + Math.random().toString(36).slice(2, 10) + "_" + Date.now().toString(36).slice(-4);
        let isRoomHost = true;
        let pendingJoinPlayerObj = null;
        let isConfirmedInHostRoster = false;
        let startMenuMode = 'local'; // 'local' | 'multiplayer'
        let myLocalSeatId = "p1";

        // Internal networking state
        let netMsgCounter = 0;
        const netSeenPacketIds = new Map();
        let netStateStamp = { version: 0, updatedAt: 0, authorId: '' };
        let netLastHostSeenAt = 0;
        let netHostCatchUpUntil = 0;
        let netGuestHostConn = null;
        let netGuestHostConnStartedAt = 0;
        let netPeerRestartTimer = null;
        let netStateBroadcastTimer = null;
        let netQueuedStatePayload = null;
        let netStateReplyTimer = null;
        let netLastJoinSentAt = 0;
        let netLastSyncRequestAt = 0;
        let netProfilePushTimer = null;
        let netLifecycleHooked = false;

        // Public STUN only. Metered's Open Relay now hands out per-account TURN credentials
        // (the old shared "openrelayproject" login is unreliable), so it was removed.
        // Players behind strict NATs still sync through the MQTT relay.
        // To add your own TURN server, append { urls, username, credential } below.
        const PEER_ICE_CONFIG = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun.cloudflare.com:3478' }
            ]
        };

        function isOnlineRoom() {
            return Boolean(gameState.roomCode) && gameState.roomCode !== 'LOCAL';
        }

        // Bots must run on exactly one device (the host), otherwise every client plays the bot's turn.
        function canRunBotsHere() {
            return !isOnlineRoom() || isRoomHost;
        }

        // Use at the top of action handlers (roll, buy, end turn...): if (!canLocalUserAct()) return;
        function canLocalUserAct() {
            if (!isOnlineRoom()) return true;
            const current = getCurrentPlayer();
            if (!current) return false;
            if (current.isBot) return isRoomHost;
            return current.id === myLocalSeatId;
        }
        window.canLocalUserAct = canLocalUserAct;

        // Wraps the existing checkAndTriggerBotTurn() so guests never run bot turns.
        function installMultiplayerGuards() {
            try {
                if (typeof checkAndTriggerBotTurn === 'function' && !checkAndTriggerBotTurn.__netGuarded) {
                    const originalBotTurn = checkAndTriggerBotTurn;
                    const guardedBotTurn = function() {
                        if (!canRunBotsHere()) return;
                        return originalBotTurn.apply(this, arguments);
                    };
                    guardedBotTurn.__netGuarded = true;
                    checkAndTriggerBotTurn = guardedBotTurn;
                    if (window.checkAndTriggerBotTurn === originalBotTurn) window.checkAndTriggerBotTurn = guardedBotTurn;
                }
            } catch (e) {
                console.warn('[net] Could not install bot guard; add `if (!canRunBotsHere()) return;` to checkAndTriggerBotTurn.', e);
            }
        }

        function getDeterministicHostPeerId(roomCode) {
            return `polytycoon-gh-${NET_PROTOCOL_VERSION}-host-${String(roomCode || 'LOCAL').trim().toUpperCase()}`;
        }

        // ---------- Input sanitising (the public relay is open to anyone who knows the room code) ----------
        function netCleanText(value, maxLen = 24) {
            return String(value ?? '').replace(/[<>"'`\\&]/g, '').replace(/\s+/g, ' ').trim().slice(0, maxLen);
        }

        function netCleanColor(value, fallback) {
            return /^#[0-9a-f]{3,8}$/i.test(String(value || '')) ? value : fallback;
        }

        function netCleanToken(value, fallback) {
            return /^[a-z0-9_-]{1,24}$/i.test(String(value || '')) ? value : fallback;
        }

        function netSanitizePlayer(p) {
            if (!p || typeof p !== 'object') return null;
            const id = netCleanText(p.id, 40);
            if (!id) return null;
            return {
                ...p,
                id,
                name: netCleanText(p.name) || 'Tycoon',
                color: netCleanColor(p.color, '#38bdf8'),
                token: netCleanToken(p.token, 'hat')
            };
        }

        // ---------- Per-tab persistence (sessionStorage survives refresh, not shared with other tabs) ----------
        function saveSeatIdForRoom(roomCode, seatId) {
            try {
                if (roomCode && roomCode !== 'LOCAL' && seatId) {
                    sessionStorage.setItem(`polytycoon_seat_${roomCode.toUpperCase()}`, seatId);
                }
            } catch (e) {}
        }

        function loadSeatIdForRoom(roomCode) {
            try {
                if (roomCode && roomCode !== 'LOCAL') {
                    return sessionStorage.getItem(`polytycoon_seat_${roomCode.toUpperCase()}`);
                }
            } catch (e) {}
            return null;
        }

        function getHostSnapshotKey(roomCode) {
            return `polytycoon_host_${String(roomCode || '').toUpperCase()}`;
        }

        // The host keeps a snapshot so a page refresh resumes the room instead of losing it.
        function persistHostSnapshot() {
            if (!isRoomHost || !isOnlineRoom()) return;
            try {
                sessionStorage.setItem(getHostSnapshotKey(gameState.roomCode), JSON.stringify({
                    seatId: myLocalSeatId,
                    savedAt: Date.now(),
                    payload: getSerializedRoomPayload({ bump: false })
                }));
            } catch (e) {}
        }

        function loadHostSnapshot(roomCode) {
            try {
                const raw = sessionStorage.getItem(getHostSnapshotKey(roomCode));
                const snap = raw ? JSON.parse(raw) : null;
                return snap && snap.payload ? snap : null;
            } catch (e) {
                return null;
            }
        }

        function clearHostSnapshot(roomCode) {
            try { sessionStorage.removeItem(getHostSnapshotKey(roomCode)); } catch (e) {}
        }

        function updateBrowserUrlParams() {
            try {
                const url = new URL(window.location.href);
                // IMPORTANT: Never put ?seat= in the browser URL so copying the address bar URL never forces a friend into the Host's seat!
                url.searchParams.delete('seat');
                if (gameState.roomCode && gameState.roomCode !== 'LOCAL') {
                    url.searchParams.set('room', gameState.roomCode);
                } else {
                    url.searchParams.delete('room');
                }
                url.searchParams.set('map', gameState.mapId || 'malaysia');
                window.history.replaceState({}, '', url.toString());
            } catch (e) {
                // Ignore in restricted sandboxed environments
            }
        }

        function copyTextSafe(text, onSuccessMessage) {
            const finish = () => {
                if (onSuccessMessage) showBannerToast(onSuccessMessage);
            };
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(finish).catch(() => {
                    fallbackExecCopy(text, finish);
                });
            } else {
                fallbackExecCopy(text, finish);
            }
        }

        function fallbackExecCopy(text, callback) {
            const temp = document.createElement("textarea");
            temp.value = text;
            temp.setAttribute('readonly', '');
            temp.style.position = 'fixed';
            temp.style.top = '-1000px';
            temp.style.opacity = '0';
            document.body.appendChild(temp);
            temp.select();
            try { document.execCommand("copy"); } catch (e) {}
            document.body.removeChild(temp);
            if (callback) callback();
        }

        // ---------- Packet helpers ----------
        function netNewMsgId() {
            netMsgCounter += 1;
            return `${myClientUniqueId}.${netMsgCounter.toString(36)}.${Math.random().toString(36).slice(2, 6)}`;
        }

        function netMarkSeen(msgId) {
            if (!msgId) return;
            netSeenPacketIds.set(msgId, Date.now());
            if (netSeenPacketIds.size > 800) {
                let excess = netSeenPacketIds.size - 500;
                for (const key of netSeenPacketIds.keys()) {
                    if (excess-- <= 0) break;
                    netSeenPacketIds.delete(key);
                }
            }
        }

        function netIsDuplicate(packet) {
            if (!packet.msgId) return false;
            if (netSeenPacketIds.has(packet.msgId)) return true;
            netMarkSeen(packet.msgId);
            return false;
        }

        function stampPacket(packet) {
            if (!packet.msgId) packet.msgId = netNewMsgId();
            if (!packet.senderClientId) packet.senderClientId = myClientUniqueId;
            if (!packet.roomCode) packet.roomCode = gameState.roomCode;
            if (packet.fromHost === undefined) {
                packet.fromHost = Boolean(isRoomHost && packet.senderClientId === myClientUniqueId);
            }
            packet.proto = NET_PROTOCOL_VERSION;
            netMarkSeen(packet.msgId); // ignore our own echo coming back through a relay
            return packet;
        }

        // ---------- State versioning ----------
        function compareStateStamps(a, b) {
            const av = Number(a && a.stateVersion) || 0;
            const bv = Number(b && b.stateVersion) || 0;
            if (av !== bv) return av > bv ? 1 : -1;
            const at = Number(a && a.updatedAt) || 0;
            const bt = Number(b && b.updatedAt) || 0;
            if (at !== bt) return at > bt ? 1 : -1;
            const aa = String((a && a.stateAuthorId) || '');
            const ba = String((b && b.stateAuthorId) || '');
            if (aa === ba) return 0;
            return aa > ba ? 1 : -1; // deterministic tie-break so every client converges on the same winner
        }

        function getLocalStateStamp() {
            return {
                stateVersion: netStateStamp.version,
                updatedAt: netStateStamp.updatedAt,
                stateAuthorId: netStateStamp.authorId
            };
        }

        function resetNetStateStamp(asAuthor) {
            netStateStamp = asAuthor
                ? { version: 1, updatedAt: Date.now(), authorId: myClientUniqueId }
                : { version: 0, updatedAt: 0, authorId: '' };
            gameState.stateVersion = netStateStamp.version;
        }

        // options.bump === false re-sends the current state without creating a new version
        function getSerializedRoomPayload(options) {
            const bump = !(options && options.bump === false);
            if (bump) {
                netStateStamp = {
                    version: Math.max(netStateStamp.version, Number(gameState.stateVersion) || 0) + 1,
                    updatedAt: Date.now(),
                    authorId: myClientUniqueId
                };
            }
            gameState.stateVersion = netStateStamp.version;
            return {
                type: 'ROOM_STATE_SYNC',
                senderClientId: myClientUniqueId,
                stateVersion: netStateStamp.version,
                updatedAt: netStateStamp.updatedAt,
                stateAuthorId: netStateStamp.authorId || myClientUniqueId,
                roomCode: gameState.roomCode,
                mapId: gameState.mapId || 'malaysia',
                status: gameState.status,
                turnIndex: gameState.turnIndex,
                turnPhase: gameState.turnPhase,
                lastDice: gameState.lastDice,
                doublesCount: gameState.doublesCount,
                freeParkingPot: gameState.freeParkingPot,
                rules: gameState.rules,
                lastEmote: gameState.lastEmote || null,
                propertiesJson: JSON.stringify(gameState.properties),
                playersJson: JSON.stringify(gameState.players),
                logsJson: JSON.stringify((gameState.logs || []).slice(-35))
            };
        }

        function showReconnectButton() {
            const reconnBtn = document.getElementById('btn-reconnect-p2p');
            if (reconnBtn) reconnBtn.classList.remove('hidden');
        }

        // Returns true when the state was applied. options.force skips the version/echo checks (host resume).
        function applyIncomingRoomPayload(data, options) {
            if (!data || typeof data !== 'object') return false;
            const force = Boolean(options && options.force);
            if (!force && data.senderClientId && data.senderClientId === myClientUniqueId) return false;
            if (!force && compareStateStamps(data, getLocalStateStamp()) <= 0) return false;

            // Parse first so a malformed packet can never half-apply
            let incomingProps = null;
            let incomingPlayers = null;
            let incomingLogs = null;
            try {
                if (data.propertiesJson) incomingProps = JSON.parse(data.propertiesJson);
                if (data.playersJson) incomingPlayers = JSON.parse(data.playersJson);
                if (data.logsJson) incomingLogs = JSON.parse(data.logsJson);
            } catch (e) {
                console.warn('[net] Ignoring malformed room state', e);
                return false;
            }

            const prevStatus = gameState.status;
            netStateStamp = {
                version: Number(data.stateVersion) || 0,
                updatedAt: Number(data.updatedAt) || 0,
                authorId: String(data.stateAuthorId || data.senderClientId || '')
            };
            gameState.stateVersion = netStateStamp.version;

            isApplyingRemoteUpdate = true;
            try {
                gameState.roomCode = data.roomCode || activeRoomId || gameState.roomCode;
                const headerCode = document.getElementById('header-room-code');
                if (headerCode) headerCode.textContent = gameState.roomCode;

                if (isOnlineRoom()) {
                    startMenuMode = 'multiplayer';
                    showReconnectButton();
                }

                if (data.mapId && data.mapId !== gameState.mapId) {
                    applyMapThemeArrays(data.mapId);
                }

                gameState.status = data.status || "playing";
                gameState.turnIndex = data.turnIndex ?? 0;
                gameState.turnPhase = data.turnPhase || "ROLL";
                gameState.lastDice = data.lastDice || [1, 1, 0];
                gameState.doublesCount = data.doublesCount ?? 0;
                gameState.freeParkingPot = data.freeParkingPot ?? 0;
                if (data.rules) gameState.rules = data.rules;
                if (incomingProps) gameState.properties = incomingProps;

                if (Array.isArray(incomingPlayers)) {
                    const cleanPlayers = incomingPlayers.map(netSanitizePlayer).filter(Boolean).slice(0, NET_MAX_SEATS);
                    // Check if our Guest seat is already in the Host's player roster
                    if (!isRoomHost && myLocalSeatId && myLocalSeatId !== 'p1') {
                        if (cleanPlayers.some(p => p.id === myLocalSeatId)) {
                            isConfirmedInHostRoster = true;
                            pendingJoinPlayerObj = null;
                        } else if (pendingJoinPlayerObj && cleanPlayers.length < NET_MAX_SEATS) {
                            // Keep our seat visible locally and re-announce to the Host (throttled)
                            cleanPlayers.push({ ...pendingJoinPlayerObj });
                            sendJoinRequest();
                        }
                    }
                    gameState.players = cleanPlayers;
                }

                if (Array.isArray(incomingLogs)) gameState.logs = incomingLogs;

                if (data.lastEmote && data.lastEmote.timestamp > lastSeenEmoteTimestamp) {
                    lastSeenEmoteTimestamp = data.lastEmote.timestamp;
                    gameState.lastEmote = data.lastEmote;
                    showFloatingEmotePopup(data.lastEmote);
                }

                updateBrowserUrlParams();

                // Show or hide the Pre-Game Start Menu based on room status ('setup' vs 'playing')
                const startModal = document.getElementById('start-menu-modal');
                if (startModal) {
                    if (gameState.status === 'setup') {
                        startModal.classList.remove('hidden');
                        startModal.classList.add('flex');
                        renderStartMenuUI();
                    } else if (gameState.status === 'playing') {
                        hasMatchStartedOnce = true;
                        if (!startModal.classList.contains('hidden')) {
                            startModal.classList.add('hidden');
                            startModal.classList.remove('flex');
                            if (prevStatus === 'setup') {
                                playSoundEffect('buy');
                                showBannerToast(`🚀 Match started! ${getCurrentPlayer()?.name}'s Turn!`);
                            }
                        }
                    }
                }

                renderAllUI();
            } finally {
                isApplyingRemoteUpdate = false;
            }

            updateP2PConnectionBadges();
            if (isRoomHost) persistHostSnapshot();
            if (canRunBotsHere()) checkAndTriggerBotTurn();
            return true;
        }

        // ---------- Incoming packet router ----------
        function handleIncomingRoomPacket(data, sourcePeerConn = null) {
            if (!data || typeof data !== 'object') return;
            if (data.senderClientId && data.senderClientId === myClientUniqueId) return;

            // Legacy WebRTC keep-alives (no msgId, never relayed)
            if (data.type === 'HEARTBEAT_PING') {
                if (sourcePeerConn && sourcePeerConn.open) {
                    try { sourcePeerConn.send({ type: 'HEARTBEAT_PONG', t: data.t, senderClientId: myClientUniqueId }); } catch (e) {}
                }
                return;
            }
            if (data.type === 'HEARTBEAT_PONG') return;

            if (data.roomCode && isOnlineRoom() && String(data.roomCode).toUpperCase() !== gameState.roomCode) return;
            if (netIsDuplicate(data)) return;

            if (data.fromHost) {
                const wasStale = Date.now() - netLastHostSeenAt > NET_HOST_TIMEOUT_MS;
                netLastHostSeenAt = Date.now();
                if (wasStale) updateP2PConnectionBadges();
            }

            if (isRoomHost) netRelayAsHost(data, sourcePeerConn);

            switch (data.type) {
                case 'HOST_HEARTBEAT':
                    handleHostHeartbeat(data);
                    break;
                case 'REQUEST_STATE_SYNC':
                    handleStateSyncRequest(data);
                    break;
                case 'JOIN_REQUEST':
                    handleJoinRequest(data);
                    break;
                case 'JOIN_REJECTED':
                    handleJoinRejected(data);
                    break;
                case 'PLAYER_PROFILE_UPDATE':
                    handleProfileUpdate(data);
                    break;
                case 'ROOM_STATE_SYNC':
                    applyIncomingRoomPayload(data);
                    break;
                default:
                    if (data.playersJson) applyIncomingRoomPayload(data); // legacy untyped state packets
            }
        }

        // The host bridges transports so a guest reachable only over WebRTC still hears relay-only guests, and vice versa.
        function netRelayAsHost(packet, sourcePeerConn) {
            if (packet.type === 'HOST_HEARTBEAT') return;
            peerConnections.forEach(c => {
                if (c !== sourcePeerConn && c && c.open) {
                    try { c.send(packet); } catch (e) {}
                }
            });
            if (sourcePeerConn) {
                netPublishMqtt(packet);
                netPostBroadcast(packet);
            }
        }

        function handleHostHeartbeat(data) {
            if (isRoomHost) {
                // Two tabs host the same room (e.g. a duplicated tab): the higher client id steps down.
                if (data.senderClientId && data.senderClientId < myClientUniqueId) demoteToGuest();
                return;
            }
            const cmp = compareStateStamps(data, getLocalStateStamp());
            if (cmp > 0) {
                requestStateSync(); // we missed an update
            } else if (cmp < 0 && netStateStamp.authorId === myClientUniqueId) {
                sendTransportPacket(getSerializedRoomPayload({ bump: false })); // the host missed our latest move
            }
        }

        function handleStateSyncRequest(data) {
            if (isRoomHost) {
                netQueueStateReply(0);
            } else if (data.fromHost && netStateStamp.version > 0) {
                // The host just refreshed and asks if anyone holds a newer state. Jitter avoids reply storms.
                netQueueStateReply(120 + Math.random() * 400);
            }
        }

        function netQueueStateReply(delayMs) {
            if (netStateReplyTimer) return;
            netStateReplyTimer = setTimeout(() => {
                netStateReplyTimer = null;
                if (isOnlineRoom()) sendTransportPacket(getSerializedRoomPayload({ bump: false }));
            }, Math.max(60, delayMs));
        }

        function handleJoinRequest(data) {
            if (!isRoomHost) return;
            const incoming = netSanitizePlayer(data.player);
            if (!incoming) return;

            const existing = gameState.players.find(p => p.id === incoming.id);
            if (existing) {
                // Reconnect/rejoin: refresh the profile only. Never reset cash, position or ownership.
                existing.uid = incoming.uid || existing.uid;
                if (gameState.status === 'setup') {
                    existing.name = incoming.name;
                    existing.token = incoming.token;
                    existing.color = incoming.color;
                    existing.ready = Boolean(incoming.ready);
                }
            } else if (gameState.players.length < NET_MAX_SEATS) {
                gameState.players.push({
                    ...incoming,
                    cash: Number(gameState.rules?.startingCash) || 1500,
                    position: 0,
                    inJail: false,
                    jailTurns: 0,
                    isBot: false,
                    bankrupt: false,
                    ready: Boolean(incoming.ready)
                });
                addGameLog(`🌐 ${incoming.name} joined the multiplayer lobby!`, "system");
                showBannerToast(`👋 ${incoming.name} joined the lobby!`);
                playSoundEffect('buy');
            } else {
                sendTransportPacket({
                    type: 'JOIN_REJECTED',
                    targetSeatId: incoming.id,
                    reason: `Room is full (${NET_MAX_SEATS}/${NET_MAX_SEATS} seats).`
                });
                return;
            }
            syncStateToCloud();
        }

        function handleJoinRejected(data) {
            if (isRoomHost || data.targetSeatId !== myLocalSeatId) return;
            pendingJoinPlayerObj = null;
            gameState.players = gameState.players.filter(p => p.id !== myLocalSeatId);
            showBannerToast(`⛔ ${netCleanText(data.reason, 80) || 'Could not join this room.'} You are spectating.`);
            renderStartMenuUI();
            renderAllUI();
        }

        function handleProfileUpdate(data) {
            const incoming = netSanitizePlayer(data.player);
            if (!incoming) return;
            const target = gameState.players.find(p => p.id === incoming.id);
            if (target) {
                target.name = incoming.name;
                target.token = incoming.token;
                target.color = incoming.color;
                target.ready = Boolean(incoming.ready);
                if (isRoomHost) {
                    syncStateToCloud();
                } else {
                    renderStartMenuUI();
                    renderAllUI();
                }
            } else if (isRoomHost) {
                handleJoinRequest({ player: incoming });
            }
        }

        function demoteToGuest() {
            if (!isRoomHost || !isOnlineRoom()) return;
            console.info('[net] Another tab is already hosting this room; continuing as a guest on the same seat.');
            const code = gameState.roomCode;
            isRoomHost = false;
            isConfirmedInHostRoster = true;
            clearHostSnapshot(code);
            startGuestJoinRetryLoop(code);
            startPeerTransport(code);
            requestStateSync(true);
            updateP2PConnectionBadges();
        }

        // ---------- Connection badges ----------
        function getNetTransportSummary() {
            const openPeers = peerConnections.filter(c => c && c.open).length;
            const brokers = mqttClients.filter(c => c && c.connected).length;
            mqttConnected = brokers > 0;
            return { openPeers, brokers, online: openPeers > 0 || brokers > 0 || Boolean(localBroadcastChannel) };
        }

        function updateP2PConnectionBadges() {
            const code = gameState.roomCode || 'LOCAL';
            if (code === 'LOCAL') return;

            const net = getNetTransportSummary();
            const humanPlayersCount = gameState.players.filter(p => !p.isBot).length;
            const hostAlive = isRoomHost || (netLastHostSeenAt > 0 && Date.now() - netLastHostSeenAt < NET_HOST_TIMEOUT_MS);
            const linkLabel = [
                net.brokers ? `Relay×${net.brokers}` : '',
                net.openPeers ? `P2P×${net.openPeers}` : ''
            ].filter(Boolean).join(' + ') || 'connecting';

            const GREEN = "bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
            const AMBER = "bg-amber-500/20 text-amber-300 border border-amber-500/30";
            const RED = "bg-rose-500/20 text-rose-300 border border-rose-500/30";

            let tone, badgeText, shareText, lobbyText;
            if (isRoomHost) {
                tone = net.online ? GREEN : AMBER;
                badgeText = net.online ? `Host (${code}) • ${humanPlayersCount} Human(s)` : `Host (${code}) • Reconnecting...`;
                shareText = net.online
                    ? `🟢 Room ${code} Active (${humanPlayersCount} Human Player(s) in Lobby) • ${linkLabel}`
                    : `🟡 Reconnecting Room ${code}...`;
                lobbyText = `${net.online ? '🟢' : '🟡'} Hosting Room ${code} (${humanPlayersCount} Human Seat(s) • ${gameState.players.length} Total)`;
            } else if (!net.online) {
                tone = AMBER;
                badgeText = `Connecting (${code})...`;
                shareText = `🟡 Connecting to Room ${code}...`;
                lobbyText = `🟡 Joining Room ${code}...`;
            } else if (!hostAlive) {
                const everSeen = netLastHostSeenAt > 0;
                tone = everSeen ? RED : AMBER;
                badgeText = everSeen ? `Host offline (${code})` : `Waiting for host (${code})...`;
                shareText = everSeen
                    ? `🔴 Room ${code}: host went offline, waiting for them to return...`
                    : `🟡 Waiting for the host of Room ${code}...`;
                lobbyText = shareText;
            } else {
                tone = isConfirmedInHostRoster ? GREEN : AMBER;
                badgeText = `Live (${code}) • Connected`;
                shareText = `🟢 Room ${code} Active (${humanPlayersCount} Human Player(s) in Lobby) • ${linkLabel}`;
                lobbyText = isConfirmedInHostRoster
                    ? `🟢 Connected to Lobby ${code} (${gameState.players.length} Seats Synced)`
                    : `🟡 Joining Room ${code}...`;
            }

            const badge = document.getElementById('connection-badge');
            if (badge) {
                badge.textContent = badgeText;
                badge.className = `text-[10px] font-bold uppercase px-2 py-0.5 rounded-full ${tone}`;
            }
            const p2pBadge = document.getElementById('share-modal-p2p-status');
            if (p2pBadge) p2pBadge.textContent = shareText;
            const lobbyPeerCount = document.getElementById('start-lobby-peer-count');
            if (lobbyPeerCount) {
                lobbyPeerCount.textContent = lobbyText;
                lobbyPeerCount.className = `text-[10px] font-bold px-2 py-0.5 rounded-full ${tone}`;
            }
        }

        // ---------- Transport 1: MQTT over WSS (two brokers in parallel, so one outage never splits the room) ----------
        function teardownMqttRelay() {
            const old = mqttClients;
            mqttClients = [];
            mqttClient = null;
            mqttConnected = false;
            old.forEach(c => { try { c.end(true); } catch (e) {} });
        }

        function netPublishMqtt(packet, json) {
            if (!activeMqttTopic || !mqttClients.length) return;
            const body = json || JSON.stringify(packet);
            if (body.length > NET_MAX_PACKET_BYTES) {
                console.warn('[net] Packet too large for relay:', body.length, 'bytes');
                return;
            }
            const qos = packet.type === 'HOST_HEARTBEAT' ? 0 : 1;
            mqttClients.forEach(c => {
                if (c && c.connected) {
                    try { c.publish(activeMqttTopic, body, { qos }); } catch (e) {}
                }
            });
        }

        function initMqttRoomRelay(cleanCode) {
            teardownMqttRelay();
            if (typeof mqtt === 'undefined') {
                console.warn('[net] MQTT library not loaded; relay disabled.');
                return;
            }
            const topic = `polytycoon/${NET_PROTOCOL_VERSION}/room/${cleanCode}`;
            activeMqttTopic = topic;

            MQTT_BROKER_URLS.forEach((url, idx) => {
                let client;
                try {
                    client = mqtt.connect(url, {
                        clientId: `pt_${myClientUniqueId}_${idx}`,
                        clean: true,
                        connectTimeout: 8000,
                        reconnectPeriod: 3000,
                        keepalive: 30,
                        resubscribe: false // we subscribe ourselves on every (re)connect
                    });
                } catch (e) {
                    console.warn(`[net] MQTT connect failed (${url})`, e);
                    return;
                }
                mqttClients.push(client);
                if (!mqttClient) mqttClient = client;
                const isCurrent = () => mqttClients.includes(client) && activeMqttTopic === topic;

                client.on('connect', () => {
                    if (!isCurrent()) return;
                    client.subscribe(topic, { qos: 1 }, (err) => {
                        if (err || !isCurrent()) return;
                        updateP2PConnectionBadges();
                        onTransportReady((pkt) => {
                            const stamped = stampPacket(pkt);
                            if (client.connected) {
                                try { client.publish(topic, JSON.stringify(stamped), { qos: 1 }); } catch (e) {}
                            }
                        });
                    });
                });
                client.on('message', (msgTopic, buf) => {
                    if (!isCurrent() || msgTopic !== topic || !buf || buf.length > NET_MAX_PACKET_BYTES) return;
                    let parsed;
                    try { parsed = JSON.parse(buf.toString()); } catch (e) { return; }
                    handleIncomingRoomPacket(parsed, null);
                });
                client.on('close', () => { if (isCurrent()) updateP2PConnectionBadges(); });
                client.on('offline', () => { if (isCurrent()) updateP2PConnectionBadges(); });
                client.on('error', (err) => console.warn(`[net] MQTT ${url}:`, (err && err.message) || err));
            });
        }

        // ---------- Transport 3: BroadcastChannel (same browser, multiple tabs) ----------
        function netPostBroadcast(packet) {
            if (!localBroadcastChannel) return;
            try { localBroadcastChannel.postMessage(packet); } catch (e) {}
        }

        function initLocalBroadcastChannel(cleanCode) {
            try { if (localBroadcastChannel) localBroadcastChannel.close(); } catch (e) {}
            localBroadcastChannel = null;
            if (typeof BroadcastChannel === 'undefined') return;
            try {
                const channel = new BroadcastChannel(`polytycoon_bc_${NET_PROTOCOL_VERSION}_${cleanCode}`);
                channel.onmessage = (ev) => {
                    if (ev && ev.data) handleIncomingRoomPacket(ev.data, null);
                };
                localBroadcastChannel = channel;
                onTransportReady((pkt) => {
                    try { channel.postMessage(stampPacket(pkt)); } catch (e) {}
                });
            } catch (e) {}
        }

        // Called whenever a transport comes up: the host announces state, guests (re)announce themselves.
        function onTransportReady(sendOne) {
            if (!isOnlineRoom()) return;
            if (isRoomHost) {
                sendOne(getSerializedRoomPayload({ bump: false }));
                if (Date.now() < netHostCatchUpUntil) {
                    sendOne({ type: 'REQUEST_STATE_SYNC' }); // after a refresh: does any guest have a newer state?
                }
            } else {
                if (pendingJoinPlayerObj) {
                    sendOne({ type: 'JOIN_REQUEST', player: { ...pendingJoinPlayerObj } });
                }
                sendOne({ type: 'REQUEST_STATE_SYNC' });
            }
            updateP2PConnectionBadges();
        }

        // Unified heartbeat: host liveness + version beacon (lets guests self-heal missed packets) + badge refresh.
        function startPeerHeartbeat() {
            if (peerHeartbeatInterval) clearInterval(peerHeartbeatInterval);
            peerHeartbeatInterval = setInterval(() => {
                peerConnections = peerConnections.filter(c => c && !/closed|failed/.test(String(c.peerConnection?.connectionState || '')));
                if (netGuestHostConn && !peerConnections.includes(netGuestHostConn)) netGuestHostConn = null;
                if (isOnlineRoom() && isRoomHost) {
                    sendTransportPacket({
                        type: 'HOST_HEARTBEAT',
                        ...getLocalStateStamp(),
                        status: gameState.status,
                        seats: gameState.players.length
                    });
                }
                updateP2PConnectionBadges();
            }, NET_HEARTBEAT_MS);
        }

        function sendJoinRequest(force) {
            if (isRoomHost || !pendingJoinPlayerObj) return;
            const now = Date.now();
            if (!force && now - netLastJoinSentAt < 1000) return;
            netLastJoinSentAt = now;
            sendTransportPacket({ type: 'JOIN_REQUEST', player: { ...pendingJoinPlayerObj } });
        }

        function requestStateSync(force) {
            const now = Date.now();
            if (!force && now - netLastSyncRequestAt < 1500) return;
            netLastSyncRequestAt = now;
            sendTransportPacket({ type: 'REQUEST_STATE_SYNC' });
        }

        function startGuestJoinRetryLoop(cleanCode) {
            if (joinRetryInterval) clearInterval(joinRetryInterval);
            joinRetryInterval = null;
            if (isRoomHost) return;

            const hostPeerId = getDeterministicHostPeerId(cleanCode);
            const handle = setInterval(() => {
                if (isRoomHost || gameState.roomCode !== cleanCode) {
                    clearInterval(handle);
                    if (joinRetryInterval === handle) joinRetryInterval = null;
                    return;
                }
                if (!isConfirmedInHostRoster && pendingJoinPlayerObj) {
                    sendJoinRequest();
                    requestStateSync();
                } else if (netStateStamp.version === 0) {
                    requestStateSync();
                }
                connectGuestToHostPeer(hostPeerId); // no-op while connected or still negotiating
            }, NET_JOIN_RETRY_MS);
            joinRetryInterval = handle;
        }

        // ---------- Transport 2: PeerJS WebRTC ----------
        function destroyPeerInstance() {
            if (netPeerRestartTimer) {
                clearTimeout(netPeerRestartTimer);
                netPeerRestartTimer = null;
            }
            const old = peerInstance;
            peerInstance = null;
            peerConnections.forEach(c => { try { c.close(); } catch (e) {} });
            peerConnections = [];
            netGuestHostConn = null;
            netGuestHostConnStartedAt = 0;
            if (old) {
                try { old.destroy(); } catch (e) {}
            }
        }

        function schedulePeerRestart(cleanCode, attempt) {
            if (netPeerRestartTimer) clearTimeout(netPeerRestartTimer);
            const delay = Math.min(30000, Math.round(3000 * Math.pow(1.6, attempt)));
            netPeerRestartTimer = setTimeout(() => {
                netPeerRestartTimer = null;
                if (gameState.roomCode === cleanCode) startPeerTransport(cleanCode, attempt + 1);
            }, delay);
        }

        function startPeerTransport(cleanCode, attempt = 0) {
            if (typeof Peer === 'undefined') {
                console.warn('[net] PeerJS not loaded; using the MQTT relay only.');
                return;
            }
            destroyPeerInstance();

            const asHost = isRoomHost;
            const hostPeerId = getDeterministicHostPeerId(cleanCode);
            const options = { debug: 1, config: PEER_ICE_CONFIG };
            let peer;
            try {
                peer = asHost ? new Peer(hostPeerId, options) : new Peer(options);
            } catch (e) {
                console.warn('[net] PeerJS init failed', e);
                schedulePeerRestart(cleanCode, attempt);
                return;
            }
            peerInstance = peer;
            const isCurrent = () => peerInstance === peer;

            peer.on('open', () => {
                if (!isCurrent()) return;
                updateP2PConnectionBadges();
                showReconnectButton();
                if (!asHost) connectGuestToHostPeer(hostPeerId, true);
            });

            peer.on('connection', (conn) => {
                if (!isCurrent() || !asHost || peerConnections.length >= 12) {
                    try { conn.close(); } catch (e) {}
                    return;
                }
                setupPeerConnection(conn);
            });

            peer.on('disconnected', () => {
                if (!isCurrent()) return;
                updateP2PConnectionBadges();
                // Lost the signaling server only; existing data channels keep working.
                setTimeout(() => {
                    if (isCurrent() && !peer.destroyed && peer.disconnected) {
                        try { peer.reconnect(); } catch (e) {}
                    }
                }, 1500);
            });

            peer.on('error', (err) => {
                if (!isCurrent()) return;
                const type = err && err.type;
                if (type === 'peer-unavailable') {
                    // Host not reachable over WebRTC yet; the relay keeps us in sync and the retry loop tries again.
                    return;
                }
                if (type === 'unavailable-id' && asHost) {
                    // Our host ID is still reserved (e.g. right after a refresh). Stay host via the relay, retry the ID.
                    schedulePeerRestart(cleanCode, attempt);
                    return;
                }
                const hasOpenConn = peerConnections.some(c => c && c.open);
                if (peer.destroyed || (!peer.open && !hasOpenConn)) {
                    schedulePeerRestart(cleanCode, attempt);
                }
                updateP2PConnectionBadges();
                console.warn('[net] PeerJS:', type || err);
            });
        }

        function initPeerRoom(roomCode, asHost) {
            const cleanCode = String(roomCode || 'LOCAL').trim().toUpperCase();
            if (cleanCode === 'LOCAL') {
                teardownAllTransports();
                return;
            }
            isRoomHost = Boolean(asHost);
            if (isRoomHost) isConfirmedInHostRoster = true;

            hookNetworkLifecycleOnce();
            initLocalBroadcastChannel(cleanCode);
            initMqttRoomRelay(cleanCode);
            startPeerHeartbeat();
            startGuestJoinRetryLoop(cleanCode);
            startPeerTransport(cleanCode);
            updateP2PConnectionBadges();
        }

        function connectGuestToHostPeer(hostPeerId, force) {
            if (isRoomHost || !peerInstance || peerInstance.destroyed || !peerInstance.open) return;
            const current = netGuestHostConn;
            if (current && current.open) return;
            if (!force && Date.now() - netGuestHostConnStartedAt < NET_PEER_CONNECT_WINDOW_MS) return; // still negotiating
            if (current) {
                try { current.close(); } catch (e) {}
                peerConnections = peerConnections.filter(c => c !== current);
            }
            let conn;
            try {
                conn = peerInstance.connect(hostPeerId, { reliable: true, serialization: 'json' });
            } catch (e) {
                return;
            }
            if (!conn) return;
            netGuestHostConn = conn;
            netGuestHostConnStartedAt = Date.now();
            setupPeerConnection(conn);
        }

        function setupPeerConnection(conn) {
            if (!conn) return;
            if (!peerConnections.includes(conn)) {
                peerConnections.push(conn);
            }
            conn.on('open', () => {
                updateP2PConnectionBadges();
                onTransportReady((pkt) => {
                    try { conn.send(stampPacket(pkt)); } catch (e) {}
                });
            });
            conn.on('data', (data) => {
                handleIncomingRoomPacket(data, conn);
            });
            const drop = () => {
                peerConnections = peerConnections.filter(c => c !== conn);
                if (netGuestHostConn === conn) netGuestHostConn = null;
                updateP2PConnectionBadges();
            };
            conn.on('close', drop);
            conn.on('error', () => {
                try { conn.close(); } catch (e) {}
                drop();
            });
        }

        function teardownAllTransports() {
            if (joinRetryInterval) { clearInterval(joinRetryInterval); joinRetryInterval = null; }
            if (peerHeartbeatInterval) { clearInterval(peerHeartbeatInterval); peerHeartbeatInterval = null; }
            destroyPeerInstance();
            teardownMqttRelay();
            activeMqttTopic = null;
            try { if (localBroadcastChannel) localBroadcastChannel.close(); } catch (e) {}
            localBroadcastChannel = null;
        }
        window.leaveMultiplayerTransports = teardownAllTransports;

        // Refresh, background tabs (mobile) and network changes
        function hookNetworkLifecycleOnce() {
            if (netLifecycleHooked) return;
            netLifecycleHooked = true;

            window.addEventListener('pagehide', () => {
                persistHostSnapshot();
                // Release the deterministic host ID right away so a refresh can reclaim it
                try { if (peerInstance) peerInstance.destroy(); } catch (e) {}
            });

            window.addEventListener('pageshow', (ev) => {
                if (ev && ev.persisted && isOnlineRoom()) window.reconnectMultiplayerRoom(true);
            });

            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState !== 'visible' || !isOnlineRoom()) return;
                // Mobile browsers freeze sockets in the background, so resync as soon as we're visible again
                if (peerInstance && !peerInstance.destroyed && peerInstance.disconnected) {
                    try { peerInstance.reconnect(); } catch (e) {}
                }
                mqttClients.forEach(c => {
                    if (c && !c.connected && !c.reconnecting) {
                        try { c.reconnect(); } catch (e) {}
                    }
                });
                if (isRoomHost) {
                    sendTransportPacket(getSerializedRoomPayload({ bump: false }));
                } else {
                    requestStateSync(true);
                }
                updateP2PConnectionBadges();
            });

            window.addEventListener('online', () => {
                if (isOnlineRoom()) window.reconnectMultiplayerRoom(true);
            });
        }

        window.reconnectMultiplayerRoom = function(silent) {
            if (!isOnlineRoom()) {
                showBannerToast("Create or Join an Online Room first!");
                return;
            }
            if (silent !== true) showBannerToast(`🔄 Reconnecting to Room ${gameState.roomCode}...`);
            initPeerRoom(gameState.roomCode, isRoomHost);
        };

        // ---------- Outgoing ----------
        function sendTransportPacket(packet) {
            if (!packet || typeof packet !== 'object') return;
            stampPacket(packet);
            const json = JSON.stringify(packet);

            // 1. PeerJS WebRTC DataChannels
            peerConnections.forEach(conn => {
                if (conn && conn.open) {
                    try { conn.send(packet); } catch (e) {}
                }
            });
            // 2. MQTT over Secure WebSockets (WSS)
            netPublishMqtt(packet, json);
            // 3. Local BroadcastChannel (multi-tab testing on the same device)
            netPostBroadcast(packet);
        }

        // State broadcasts are coalesced: a burst of updates (animations, chained actions) goes out as one packet.
        function broadcastToPeers(payload) {
            if (!payload) return;
            if (payload.type !== 'ROOM_STATE_SYNC') {
                sendTransportPacket(payload);
                return;
            }
            netQueuedStatePayload = payload;
            if (netStateBroadcastTimer) return;
            netStateBroadcastTimer = setTimeout(() => {
                netStateBroadcastTimer = null;
                const latest = netQueuedStatePayload;
                netQueuedStatePayload = null;
                if (!latest || !isOnlineRoom()) return;
                sendTransportPacket(latest);
                if (isRoomHost) persistHostSnapshot();
            }, NET_STATE_COALESCE_MS);
        }
<!-- ... existing code ... -->
        function generateRoomCode(length = 4) {
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // 32 chars, so a byte modulo stays unbiased
            const bytes = new Uint8Array(length);
            if (window.crypto && window.crypto.getRandomValues) {
                window.crypto.getRandomValues(bytes);
            } else {
                for (let i = 0; i < length; i++) bytes[i] = Math.floor(Math.random() * 256);
            }
            return Array.from(bytes, b => chars[b % chars.length]).join('');
        }

        // Host refreshed the page: restore the room from this tab's snapshot and keep hosting.
        function resumeHostedRoom(code, snapshot) {
            gameState.roomCode = code;
            activeRoomId = code;
            isRoomHost = true;
            isConfirmedInHostRoster = true;
            pendingJoinPlayerObj = null;
            startMenuMode = 'multiplayer';
            myLocalSeatId = snapshot.seatId || loadSeatIdForRoom(code) || 'p1';
            netLastHostSeenAt = Date.now();
            netHostCatchUpUntil = Date.now() + 20000;

            applyIncomingRoomPayload(snapshot.payload, { force: true });
            initPeerRoom(code, true);

            const shareCodeEl = document.getElementById('share-modal-room-code');
            const shareUrlInput = document.getElementById('share-url-input');
            if (shareCodeEl) shareCodeEl.textContent = code;
            if (shareUrlInput) shareUrlInput.value = getShareableInviteUrl();

            showBannerToast(`♻️ Resumed hosting Room ${code}`);
            renderStartMenuUI();
            renderAllUI();
        }

        window.createOnlineRoom = async function() {
            const code = generateRoomCode(4);

            gameState.roomCode = code;
            activeRoomId = code;
            isRoomHost = true;
            isConfirmedInHostRoster = true;
            pendingJoinPlayerObj = null;
            startMenuMode = 'multiplayer';
            const hostSeat = gameState.players.find(p => !p.isBot) || gameState.players[0];
            myLocalSeatId = hostSeat?.id || "p1";
            saveSeatIdForRoom(code, myLocalSeatId);
            resetNetStateStamp(true);
            netLastHostSeenAt = Date.now();
            netHostCatchUpUntil = 0;

            const headerCode = document.getElementById('header-room-code');
            if (headerCode) headerCode.textContent = code;
            updateBrowserUrlParams();

            const shareCodeEl = document.getElementById('share-modal-room-code');
            const shareUrlInput = document.getElementById('share-url-input');
            if (shareCodeEl) shareCodeEl.textContent = code;
            if (shareUrlInput) shareUrlInput.value = getShareableInviteUrl();

            const statusEl = document.getElementById('lobby-room-status');
            if (statusEl) {
                statusEl.textContent = `✅ Room ${code} live! Share the code or Invite URL with friends.`;
                statusEl.classList.remove('hidden');
            }

            initPeerRoom(code, true);
            persistHostSnapshot();

            if (db && currentUser) {
                try {
                    await syncStateToCloud();
                    subscribeToCloudRoom(code);
                } catch (e) {
                    console.warn('[net] Firebase sync failed; continuing with P2P + relay.', e);
                }
            } else {
                showBannerToast(`🌐 Room ${code} created! Share link or code with friends.`);
            }

            renderStartMenuUI();
            renderAllUI();
        };

        window.joinOnlineRoom = async function(forcedCode) {
            const codeInput = document.getElementById('lobby-join-code');
            const rawCode = typeof forcedCode === 'string' ? forcedCode : (codeInput?.value || "");
            const code = rawCode.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (code.length < 3) {
                showBannerToast("Enter a valid 4-character Room Code!");
                return;
            }

            // This tab created the room before a refresh, so resume hosting instead of joining as a guest
            const hostSnapshot = loadHostSnapshot(code);
            if (hostSnapshot) {
                resumeHostedRoom(code, hostSnapshot);
                return;
            }

            gameState.roomCode = code;
            activeRoomId = code;
            isRoomHost = false;
            isConfirmedInHostRoster = false;
            startMenuMode = 'multiplayer';
            netLastHostSeenAt = 0;
            netHostCatchUpUntil = 0;
            resetNetStateStamp(false); // accept the host's state whatever its version

            const headerCode = document.getElementById('header-room-code');
            if (headerCode) headerCode.textContent = code;

            // Reuse this tab's guest seat for this room (refresh = rejoin same seat), or create a new one
            const savedSeat = loadSeatIdForRoom(code);
            if (savedSeat && savedSeat !== "p1") {
                myLocalSeatId = savedSeat;
            } else if (!myLocalSeatId || !String(myLocalSeatId).startsWith('guest_')) {
                myLocalSeatId = "guest_" + Math.floor(Math.random() * 900000 + 100000);
            }
            saveSeatIdForRoom(code, myLocalSeatId);
            updateBrowserUrlParams();

            const guestSuffix = myLocalSeatId.slice(-2);
            const guestColors = ['#f43f5e', '#f59e0b', '#a855f7', '#ec4899', '#38bdf8'];
            const guestTokens = ['hat', 'ship', 'crown', 'dragon', 'rocket'];
            const pickIdx = parseInt(guestSuffix, 10) || 1;
            const currentNameVal = netCleanText(document.getElementById('start-my-name-input')?.value);
            const guestName = (!currentNameVal || currentNameVal === "TycoonAlex")
                ? `Tycoon_${guestSuffix}`
                : currentNameVal;

            const guestPlayerObj = {
                id: myLocalSeatId,
                uid: currentUser?.uid || myClientUniqueId,
                name: guestName,
                color: guestColors[pickIdx % guestColors.length],
                token: guestTokens[pickIdx % guestTokens.length],
                cash: Number(gameState.rules?.startingCash) || 1500,
                position: 0,
                inJail: false,
                jailTurns: 0,
                isBot: false,
                ready: true,
                bankrupt: false
            };

            // Start from a clean roster (only our seat) until the host's state arrives, so local/bot seats never leak in.
            // getMyLobbyPlayer() still finds our seat, so the name never resets to TycoonAlex.
            gameState.players = [guestPlayerObj];
            gameState.turnIndex = 0;
            pendingJoinPlayerObj = { ...guestPlayerObj };

            initPeerRoom(code, false);

            if (db && currentUser) {
                try {
                    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'monopoly_rooms', code);
                    const snap = await getDoc(roomRef);
                    if (snap.exists()) {
                        applyIncomingRoomPayload(snap.data());
                        if (!gameState.players.some(p => p.id === myLocalSeatId) && gameState.players.length < NET_MAX_SEATS) {
                            gameState.players.push(guestPlayerObj);
                            addGameLog(`🌐 ${guestPlayerObj.name} joined Lobby ${code}!`, "system");
                            await syncStateToCloud();
                        }
                    }
                    // If the doc doesn't exist yet, don't write one as a guest: the JOIN_REQUEST flow handles it.
                    subscribeToCloudRoom(code);
                    showBannerToast(`🎉 Joined Multiplayer Lobby ${code}! Customize your name & token.`);
                } catch (e) {
                    showBannerToast(`🔗 Connecting to Lobby ${code}...`);
                }

        // Profile changes: guests send a small PLAYER_PROFILE_UPDATE, the host re-syncs the room.
        // Name typing is debounced so every keystroke doesn't hit the network.
        function pushMyProfileUpdate(me, debounce) {
            const flush = () => {
                netProfilePushTimer = null;
                if (isRoomHost) {
                    syncStateToCloud();
                } else {
                    sendTransportPacket({
                        type: 'PLAYER_PROFILE_UPDATE',
                        player: { ...me }
                    });
                }
            };
            if (!isRoomHost) {
                renderStartMenuUI();
                renderAllUI();
            }
            if (netProfilePushTimer) clearTimeout(netProfilePushTimer);
            if (debounce) {
                netProfilePushTimer = setTimeout(flush, 300);
            } else {
                flush();
            }
        }

        window.updateMyLobbyProfile = function(field, value) {
            const me = getMyLobbyPlayer();
            if (!me) return;

            if (field === 'name') {
                me.name = netCleanText(value) || 'Tycoon';
                const lobbyName = document.getElementById('lobby-player-name');
                // Don't overwrite the input while the user is typing in it (would eat spaces / move the caret)
                if (lobbyName && document.activeElement !== lobbyName) lobbyName.value = me.name;
            } else if (field === 'token') {
                me.token = netCleanToken(value, me.token);
                playSoundEffect('step');
            } else if (field === 'color') {
                me.color = netCleanColor(value, me.color);
                playSoundEffect('step');
            }

            if (pendingJoinPlayerObj && pendingJoinPlayerObj.id === me.id) {
                pendingJoinPlayerObj = { ...me };
            }

            pushMyProfileUpdate(me, field === 'name');
        };

        window.toggleMyLobbyReady = function() {
            const me = getMyLobbyPlayer();
            if (!me) return;

            me.ready = !me.ready;
            playSoundEffect('step');

            if (pendingJoinPlayerObj && pendingJoinPlayerObj.id === me.id) {
                pendingJoinPlayerObj = { ...me };
            }

            pushMyProfileUpdate(me, false);
        };

        window.onload = async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const paramMap = urlParams.get('map');
            const paramRoom = (urlParams.get('room') || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');

            if (paramMap && MAP_THEMES[paramMap]) {
                gameState.mapId = paramMap;
                BOARD_TILES = MAP_THEMES[paramMap].tiles;
                CHANCE_CARDS = MAP_THEMES[paramMap].chance;
                CHEST_CARDS = MAP_THEMES[paramMap].chest;
                const headerSel = document.getElementById('header-map-select');
                if (headerSel) headerSel.value = paramMap;
                const ruleSel = document.getElementById('rule-map-select');
                if (ruleSel) ruleSel.value = paramMap;
            }

            build2DBoardDOM();
            renderPredefinedEmotes();
            updateBoardDimensions();

            const stageArea = document.getElementById('board-stage-area');
            if (stageArea && window.ResizeObserver) {
                const ro = new ResizeObserver(() => {
                    updateBoardDimensions();
                });
                ro.observe(stageArea);
            }
            window.addEventListener('resize', updateBoardDimensions);

            installMultiplayerGuards();
            renderAllUI();
            renderStartMenuUI();
            animateThreeLoop();

            // Firebase is optional and usually not configured on GitHub Pages.
            // Never let it block (4s cap) or break the multiplayer join.
            const firebaseInit = Promise.resolve()
                .then(() => initFirebaseConnection())
                .catch((e) => console.warn('[net] Firebase unavailable; using P2P + MQTT relay only.', e));
            await Promise.race([firebaseInit, new Promise(resolve => setTimeout(resolve, 4000))]);

            if (paramRoom.length >= 3 && paramRoom !== 'LOCAL') {
                startMenuMode = 'multiplayer';
                await window.joinOnlineRoom(paramRoom);
