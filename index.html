        let peerInstance = null;

        let peerHeartbeatInterval = null;
        let joinRetryInterval = null;

        let mqttConnected = false;

        function getDeterministicHostPeerId(roomCode) {
            return `polytycoon-gh-v3-host-${String(roomCode || 'LOCAL').trim().toUpperCase()}`;
        }

        function saveSeatIdForRoom(roomCode, seatId) {
            try {
                if (roomCode && roomCode !== 'LOCAL' && seatId) {
                    sessionStorage.setItem(`polytycoon_seat_${roomCode.toUpperCase()}`, seatId);
                }
            } catch (e) {}
        }

        function loadSeatIdForRoom(roomCode) {
            try {
                if (roomCode && roomCode !== 'LOCAL') {
                    return sessionStorage.getItem(`polytycoon_seat_${roomCode.toUpperCase()}`);
                }
            } catch (e) {}
            return null;
        }

        function updateBrowserUrlParams() {
            try {
                const url = new URL(window.location.href);
                // IMPORTANT: Never put ?seat= in the browser URL so copying the address bar URL never forces a friend into the Host's seat!
                url.searchParams.delete('seat');
                if (gameState.roomCode && gameState.roomCode !== 'LOCAL') {
                    url.searchParams.set('room', gameState.roomCode);
                } else {
                    url.searchParams.delete('room');
                }
                url.searchParams.set('map', gameState.mapId || 'malaysia');
                window.history.replaceState({}, '', url.toString());
            } catch (e) {
                // Ignore in restricted sandboxed environments
            }
        }

        function copyTextSafe(text, onSuccessMessage) {
            const finish = () => {
                if (onSuccessMessage) showBannerToast(onSuccessMessage);
            };
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(finish).catch(() => {
                    fallbackExecCopy(text, finish);
                });
            } else {
                fallbackExecCopy(text, finish);
            }
        }

        function fallbackExecCopy(text, callback) {
            const tempInput = document.createElement("input");
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            try { document.execCommand("copy"); } catch (e) {}
            document.body.removeChild(tempInput);
            if (callback) callback();
        }

        function getSerializedRoomPayload() {
            gameState.stateVersion = (gameState.stateVersion || 0) + 1;
            return {
                type: 'ROOM_STATE_SYNC',
                senderClientId: myClientUniqueId,
                stateVersion: gameState.stateVersion,
                roomCode: gameState.roomCode,
                mapId: gameState.mapId || 'malaysia',
                status: gameState.status,
                turnIndex: gameState.turnIndex,
                turnPhase: gameState.turnPhase,
                lastDice: gameState.lastDice,
                doublesCount: gameState.doublesCount,
                freeParkingPot: gameState.freeParkingPot,
                rules: gameState.rules,
                lastEmote: gameState.lastEmote || null,
                propertiesJson: JSON.stringify(gameState.properties),
                playersJson: JSON.stringify(gameState.players),
                logsJson: JSON.stringify(gameState.logs.slice(-35)),
                updatedAt: Date.now()
            };
        }

        function applyIncomingRoomPayload(data) {
            if (!data) return;
            if (data.senderClientId && data.senderClientId === myClientUniqueId) return;

            const prevStatus = gameState.status;
            isApplyingRemoteUpdate = true;

            gameState.roomCode = data.roomCode || activeRoomId || gameState.roomCode;
            document.getElementById('header-room-code').textContent = gameState.roomCode;
            if (gameState.roomCode && gameState.roomCode !== 'LOCAL') {
                startMenuMode = 'multiplayer';
                const reconnBtn = document.getElementById('btn-reconnect-p2p');
                if (reconnBtn) reconnBtn.classList.remove('hidden');
            }

            if (data.mapId && data.mapId !== gameState.mapId) {
                applyMapThemeArrays(data.mapId);
            }
            gameState.status = data.status || "playing";
            gameState.turnIndex = data.turnIndex ?? 0;
            gameState.turnPhase = data.turnPhase || "ROLL";
            gameState.lastDice = data.lastDice || [1, 1, 0];
            gameState.doublesCount = data.doublesCount ?? 0;
            gameState.freeParkingPot = data.freeParkingPot ?? 0;
            if (data.rules) gameState.rules = data.rules;
            if (data.propertiesJson) gameState.properties = JSON.parse(data.propertiesJson);
            if (data.playersJson) {
                const incomingPlayers = JSON.parse(data.playersJson);
                if (Array.isArray(incomingPlayers)) {
                    // Check if our Guest seat is already in the Host's player roster
                    if (!isRoomHost && myLocalSeatId && myLocalSeatId !== 'p1') {
                        const foundMe = incomingPlayers.some(p => p.id === myLocalSeatId);
                        if (foundMe) {
                            isConfirmedInHostRoster = true;
                            pendingJoinPlayerObj = null;
                        } else if (pendingJoinPlayerObj && incomingPlayers.length < 6) {
                            // Keep our local seat visible while immediately re-announcing our JOIN_REQUEST to the Host
                            incomingPlayers.push(pendingJoinPlayerObj);
                            setTimeout(() => {
                                if (pendingJoinPlayerObj) {
                                    sendTransportPacket({
                                        type: 'JOIN_REQUEST',
                                        senderClientId: myClientUniqueId,
                                        player: pendingJoinPlayerObj
                                    });
                                }
                            }, 80);
                        }
                    }
                    gameState.players = incomingPlayers;
                }
            }
            if (data.logsJson) gameState.logs = JSON.parse(data.logsJson);
            if (data.lastEmote && data.lastEmote.timestamp > lastSeenEmoteTimestamp) {
                lastSeenEmoteTimestamp = data.lastEmote.timestamp;
                gameState.lastEmote = data.lastEmote;
                showFloatingEmotePopup(data.lastEmote);
            }

            updateBrowserUrlParams();
            updateP2PConnectionBadges();

            // Show or hide the Pre-Game Start Menu based on room status ('setup' vs 'playing')
            const startModal = document.getElementById('start-menu-modal');
            if (startModal) {
                if (gameState.status === 'setup') {
                    startModal.classList.remove('hidden');
                    startModal.classList.add('flex');
                    renderStartMenuUI();
                } else if (gameState.status === 'playing') {
                    hasMatchStartedOnce = true;
                    if (!startModal.classList.contains('hidden')) {
                        startModal.classList.add('hidden');
                        startModal.classList.remove('flex');
                        if (prevStatus === 'setup') {
                            playSoundEffect('buy');
                            showBannerToast(`🚀 Match started! ${getCurrentPlayer()?.name}'s Turn!`);
                        }
                    }
                }
            }

            renderAllUI();
            isApplyingRemoteUpdate = false;
            checkAndTriggerBotTurn();
        }

        function handleIncomingRoomPacket(data, sourcePeerConn = null) {
            if (!data || typeof data !== 'object') return;
            if (data.senderClientId && data.senderClientId === myClientUniqueId) return;

            if (data.type === 'HEARTBEAT_PING') {
                if (sourcePeerConn && sourcePeerConn.open) {
                    try { sourcePeerConn.send({ type: 'HEARTBEAT_PONG', t: data.t, senderClientId: myClientUniqueId }); } catch (e) {}
                }
                return;
            }
            if (data.type === 'HEARTBEAT_PONG') {
                return;
            }
            if (data.type === 'REQUEST_STATE_SYNC') {
                if (isRoomHost) {
                    const payload = getSerializedRoomPayload();
                    if (sourcePeerConn && sourcePeerConn.open) {
                        try { sourcePeerConn.send(payload); } catch (e) {}
                    }
                    broadcastToPeers(payload);
                }
                return;
            }
            if (data.type === 'JOIN_REQUEST' && data.player) {
                if (!isRoomHost) return;
                const existingIdx = gameState.players.findIndex(p => p.id === data.player.id);
                if (existingIdx >= 0) {
                    gameState.players[existingIdx] = { ...gameState.players[existingIdx], ...data.player };
                } else if (gameState.players.length < 6) {
                    gameState.players.push(data.player);
                    addGameLog(`🌐 ${data.player.name} joined the multiplayer lobby!`, "system");
                    showBannerToast(`👋 ${data.player.name} joined the lobby!`);
                    playSoundEffect('buy');
                }
                syncStateToCloud();
                return;
            }
            if (data.type === 'PLAYER_PROFILE_UPDATE' && data.player) {
                const target = gameState.players.find(p => p.id === data.player.id);
                if (target) {
                    target.name = data.player.name;
                    target.token = data.player.token;
                    target.color = data.player.color;
                    target.ready = Boolean(data.player.ready);
                    if (isRoomHost) {
                        syncStateToCloud();
                    } else {
                        renderStartMenuUI();
                        renderAllUI();
                    }
                } else if (isRoomHost && gameState.players.length < 6) {
                    gameState.players.push(data.player);
                    syncStateToCloud();
                }
                return;
            }

            // Standard full room state payload
            if (data.roomCode || data.playersJson) {
                applyIncomingRoomPayload(data);
                // If we are the Host and received a state update from a Guest over PeerJS, relay to other PeerJS guests
                if (isRoomHost && sourcePeerConn) {
                    peerConnections.forEach(c => {
                        if (c !== sourcePeerConn && c && c.open) {
                            try { c.send(data); } catch (e) {}
                        }
                    });
                }
            }
        }

        function updateP2PConnectionBadges() {
            const openPeers = peerConnections.filter(c => c && c.open).length;
            const humanPlayersCount = gameState.players.filter(p => !p.isBot).length;
            const isConnected = openPeers > 0 || mqttConnected || isConfirmedInHostRoster;
            const badge = document.getElementById('connection-badge');
            const p2pBadge = document.getElementById('share-modal-p2p-status');
            const lobbyPeerCount = document.getElementById('start-lobby-peer-count');
            const code = gameState.roomCode || 'LOCAL';

            if (code === 'LOCAL') return;

            if (badge) {
                if (isRoomHost) {

                    badge.className = "text-[10px] font-bold uppercase px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
                } else {
                    badge.textContent = isConnected ? `Live (${code}) • Connected` : `Connecting (${code})...`;
                    badge.className = isConnected
                        ? "text-[10px] font-bold uppercase px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30"
                        : "text-[10px] font-bold uppercase px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30";
                }
            }
            if (p2pBadge) {
                p2pBadge.textContent = isConnected
                    ? `🟢 Room ${code} Active (${humanPlayersCount} Human Player(s) in Lobby)`
                    : `🟡 Connecting to Room ${code}...`;
            }
            if (lobbyPeerCount) {
                if (isRoomHost) {
                    lobbyPeerCount.textContent = `🟢 Hosting Room ${code} (${humanPlayersCount} Human Seat(s) • ${gameState.players.length} Total)`;
                    lobbyPeerCount.className = "text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
                } else if (isConfirmedInHostRoster || isConnected) {
                    lobbyPeerCount.textContent = `🟢 Connected to Lobby ${code} (${gameState.players.length} Seats Synced)`;
                    lobbyPeerCount.className = "text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
                } else {
                    lobbyPeerCount.textContent = `🟡 Joining Room ${code}...`;
                    lobbyPeerCount.className = "text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30";
                }

        }

        function initMqttRoomRelay(cleanCode) {
            if (typeof mqtt === 'undefined') return;
            try {
                if (mqttClient) {
                    try { mqttClient.end(true); } catch (e) {}
                    mqttClient = null;
                }
                mqttConnected = false;
                activeMqttTopic = `polytycoon/v3/room/${cleanCode}`;

                // Connect over Secure WebSockets (WSS) so NATs/firewalls that block WebRTC UDP still sync instantaneously
                mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
                    clientId: `pt_${cleanCode}_${myClientUniqueId}`,
                    clean: true,
                    connectTimeout: 5000,
                    reconnectPeriod: 2000
                });

                mqttClient.on('connect', () => {
                    mqttConnected = true;
                    updateP2PConnectionBadges();
                    mqttClient.subscribe(activeMqttTopic, { qos: 0 }, (err) => {
                        if (!err) {
                            if (isRoomHost) {
                                sendTransportPacket(getSerializedRoomPayload());
                            } else {
                                if (pendingJoinPlayerObj) {
                                    sendTransportPacket({
                                        type: 'JOIN_REQUEST',
                                        senderClientId: myClientUniqueId,
                                        player: pendingJoinPlayerObj
                                    });
                                }
                                sendTransportPacket({
                                    type: 'REQUEST_STATE_SYNC',
                                    senderClientId: myClientUniqueId
                                });
                            }
                        }
                    });
                });

                mqttClient.on('message', (topic, messageBuffer) => {
                    if (topic !== activeMqttTopic) return;
                    try {
                        const parsed = JSON.parse(messageBuffer.toString());
                        handleIncomingRoomPacket(parsed, null);
                    } catch (e) {}
                });

                mqttClient.on('close', () => {
                    mqttConnected = false;
                    updateP2PConnectionBadges();
                });
            } catch (e) {
                console.warn("MQTT WSS relay warning:", e);
            }
        }

        function initLocalBroadcastChannel(cleanCode) {
            try {
                if (localBroadcastChannel) {
                    localBroadcastChannel.close();
                    localBroadcastChannel = null;
                }
                if (typeof BroadcastChannel !== 'undefined') {
                    localBroadcastChannel = new BroadcastChannel(`polytycoon_bc_${cleanCode}`);
                    localBroadcastChannel.onmessage = (ev) => {
                        if (ev && ev.data) {
                            handleIncomingRoomPacket(ev.data, null);
                        }
                    };
                }
            } catch (e) {}
        }

        function startPeerHeartbeat() {
            if (peerHeartbeatInterval) clearInterval(peerHeartbeatInterval);
            peerHeartbeatInterval = setInterval(() => {
                peerConnections = peerConnections.filter(c => c && !c.peerConnection?.connectionState?.includes('closed'));
                peerConnections.forEach(c => {
                    if (c && c.open) {
                        try { c.send({ type: 'HEARTBEAT_PING', t: Date.now(), senderClientId: myClientUniqueId }); } catch (e) {}
                    }
                });
                updateP2PConnectionBadges();
            }, 4500);
        }

        function startGuestJoinRetryLoop(cleanCode) {
            if (joinRetryInterval) clearInterval(joinRetryInterval);
            if (isRoomHost) return;

            const hostPeerId = getDeterministicHostPeerId(cleanCode);
            joinRetryInterval = setInterval(() => {
                if (isRoomHost || gameState.roomCode === 'LOCAL') {
                    clearInterval(joinRetryInterval);
                    return;
                }
                // If Guest is not yet confirmed in the Host's roster, keep announcing JOIN_REQUEST & requesting sync
                if (!isConfirmedInHostRoster && pendingJoinPlayerObj) {
                    sendTransportPacket({
                        type: 'JOIN_REQUEST',
                        senderClientId: myClientUniqueId,
                        player: pendingJoinPlayerObj
                    });
                    sendTransportPacket({
                        type: 'REQUEST_STATE_SYNC',
                        senderClientId: myClientUniqueId
                    });
                }
                // Also ensure WebRTC PeerJS attempts reconnection if no open peer connection exists
                const hasOpenPeer = peerConnections.some(c => c && c.open);
                if (!hasOpenPeer && peerInstance && !peerInstance.destroyed && peerInstance.open) {
                    connectGuestToHostPeer(hostPeerId);
                }
            }, 2200);
        }

        function initPeerRoom(roomCode, asHost) {
            const cleanCode = String(roomCode || 'LOCAL').trim().toUpperCase();
            isRoomHost = Boolean(asHost);
            if (asHost) {
                isConfirmedInHostRoster = true;
            }

            // Initialize instant same-browser BroadcastChannel & firewall-proof MQTT WSS Relay in parallel with PeerJS
            initLocalBroadcastChannel(cleanCode);
            initMqttRoomRelay(cleanCode);
            startGuestJoinRetryLoop(cleanCode);

            if (typeof Peer === 'undefined') return;

            try {
                if (peerInstance) {
                    peerInstance.destroy();
                    peerInstance = null;
                }
                peerConnections = [];

                const hostPeerId = getDeterministicHostPeerId(cleanCode);
                const myPeerId = asHost
                    ? hostPeerId
                    : `polytycoon-gh-v3-guest-${cleanCode}-${Math.floor(Math.random() * 900000 + 100000)}`;

                peerInstance = new Peer(myPeerId, {
                    debug: 1,
                    config: PEER_ICE_CONFIG
                });

                peerInstance.on('open', () => {
                    updateP2PConnectionBadges();
                    startPeerHeartbeat();

                    const reconnBtn = document.getElementById('btn-reconnect-p2p');
                    if (reconnBtn) reconnBtn.classList.remove('hidden');

                    if (!asHost) {
                        connectGuestToHostPeer(hostPeerId);
                    }
                });

                peerInstance.on('connection', (conn) => {
                    setupPeerConnection(conn);
                });

                peerInstance.on('disconnected', () => {
                    updateP2PConnectionBadges();
                    if (peerInstance && !peerInstance.destroyed) {
                        try { peerInstance.reconnect(); } catch (e) {}
                    }
                });

                peerInstance.on('error', (err) => {
                    if (asHost && err && err.type === 'unavailable-id') {
                        console.info("Host ID already active on signaling server; switching to Guest connection...");
                        isRoomHost = false;
                        initPeerRoom(cleanCode, false);
                        return;
                    }
                    updateP2PConnectionBadges();
                });
            } catch (e) {
                console.warn("P2P init warning:", e);
            }
        }

        function connectGuestToHostPeer(hostPeerId) {
            if (!peerInstance || peerInstance.destroyed) return;
            const conn = peerInstance.connect(hostPeerId, {
                reliable: true,
                serialization: 'json'
            });
            setupPeerConnection(conn);
        }

        function setupPeerConnection(conn) {
            if (!conn) return;
            if (!peerConnections.includes(conn)) {
                peerConnections.push(conn);
            }

            conn.on('open', () => {
                updateP2PConnectionBadges();

                if (isRoomHost) {
                    try { conn.send(getSerializedRoomPayload()); } catch (e) {}
                } else {
                    if (pendingJoinPlayerObj) {
                        try {
                            conn.send({
                                type: 'JOIN_REQUEST',
                                senderClientId: myClientUniqueId,
                                player: pendingJoinPlayerObj
                            });
                        } catch (e) {}
                    }
                    try { conn.send({ type: 'REQUEST_STATE_SYNC', senderClientId: myClientUniqueId }); } catch (e) {}
                }
            });

            conn.on('data', (data) => {
                handleIncomingRoomPacket(data, conn);
            });

            conn.on('close', () => {
                peerConnections = peerConnections.filter(c => c !== conn);
                updateP2PConnectionBadges();
            });

            conn.on('error', () => {
                updateP2PConnectionBadges();
            });
        }

        window.reconnectMultiplayerRoom = function() {
            if (!gameState.roomCode || gameState.roomCode === 'LOCAL') {
                showBannerToast("Create or Join an Online Room first!");
                return;
            }
            showBannerToast(`🔄 Reconnecting to Room ${gameState.roomCode}...`);
            initPeerRoom(gameState.roomCode, isRoomHost);
        };

        function sendTransportPacket(packet) {
            if (!packet) return;
            if (!packet.senderClientId) packet.senderClientId = myClientUniqueId;

            // 1. Send over PeerJS WebRTC DataChannels
            peerConnections.forEach(conn => {
                if (conn && conn.open) {
                    try { conn.send(packet); } catch (e) {}
                }
            });

            // 2. Send over MQTT over Secure WebSockets (WSS)
            if (mqttClient && mqttConnected && activeMqttTopic) {
                try {
                    mqttClient.publish(activeMqttTopic, JSON.stringify(packet), { qos: 0 });
                } catch (e) {}
            }

            // 3. Send over Local BroadcastChannel (for multi-tab testing on same device)
            if (localBroadcastChannel) {
                try {
                    localBroadcastChannel.postMessage(packet);
                } catch (e) {}
            }
        }

        function broadcastToPeers(payload) {
            sendTransportPacket(payload);
        }

        window.joinOnlineRoom = async function(forcedCode) {
            const codeInput = document.getElementById('lobby-join-code');
            const code = (forcedCode || codeInput?.value || "").trim().toUpperCase();
            if (code.length < 3) {
                showBannerToast("Enter a valid 4-character Room Code!");
                return;
            }
            gameState.roomCode = code;
            activeRoomId = code;
            isRoomHost = false;
            isConfirmedInHostRoster = false;
            startMenuMode = 'multiplayer';
            document.getElementById('header-room-code').textContent = code;

            // Load existing guest seat ID for this room from sessionStorage, or generate a brand-new unique Guest Seat ID
            const savedSeat = loadSeatIdForRoom(code);
            if (savedSeat && savedSeat !== "p1") {
                myLocalSeatId = savedSeat;
            } else if (!myLocalSeatId || myLocalSeatId === "p1") {
                myLocalSeatId = "guest_" + Math.floor(Math.random() * 900000 + 100000);
                saveSeatIdForRoom(code, myLocalSeatId);
            }
            updateBrowserUrlParams();

            const guestSuffix = myLocalSeatId.slice(-2);
            const guestColors = ['#f43f5e', '#f59e0b', '#a855f7', '#ec4899', '#38bdf8'];
            const guestTokens = ['hat', 'ship', 'crown', 'dragon', 'rocket'];
            const pickIdx = parseInt(guestSuffix, 10) || 1;

            const currentNameVal = document.getElementById('start-my-name-input')?.value?.trim();
            const guestName = (!currentNameVal || currentNameVal === "TycoonAlex")
                ? `Tycoon_${guestSuffix}`
                : currentNameVal;

            const guestPlayerObj = {
                id: myLocalSeatId,
                uid: currentUser?.uid || myClientUniqueId,
                name: guestName,
                color: guestColors[pickIdx % guestColors.length],
                token: guestTokens[pickIdx % guestTokens.length],
                cash: Number(gameState.rules.startingCash) || 1500,
                position: 0,
                inJail: false,
                jailTurns: 0,
                isBot: false,
                ready: true,
                bankrupt: false
            };

            // Add Guest immediately to local players array so getMyLobbyPlayer() finds their seat & never resets to TycoonAlex!
            const existingIdx = gameState.players.findIndex(p => p.id === myLocalSeatId);
            if (existingIdx >= 0) {
                gameState.players[existingIdx] = guestPlayerObj;
            } else {
                gameState.players.push(guestPlayerObj);
            }

            pendingJoinPlayerObj = guestPlayerObj;
            initPeerRoom(code, false);

            if (db && currentUser) {
                try {
                    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'monopoly_rooms', code);
                    const snap = await getDoc(roomRef);
                    if (snap.exists()) {
                        applyIncomingRoomPayload(snap.data());
                        if (!gameState.players.some(p => p.id === myLocalSeatId) && gameState.players.length < 6) {
                            gameState.players.push(guestPlayerObj);
                            addGameLog(`🌐 ${guestPlayerObj.name} joined Lobby ${code}!`, "system");
                            await syncStateToCloud();
                        }
                    } else {
                        await syncStateToCloud();
                    }
                    subscribeToCloudRoom(code);
                    showBannerToast(`🎉 Joined Multiplayer Lobby ${code}! Customize your name & token.`);
                } catch (e) {
                    showBannerToast(`🔗 Connecting to Lobby ${code}...`);
                }
            } else {
                showBannerToast(`🔗 Joining Lobby ${code} as ${guestPlayerObj.name}...`);
            }

            renderStartMenuUI();
            renderAllUI();
        };
